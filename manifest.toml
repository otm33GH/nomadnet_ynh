#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nomadnet"
name = "NomadNet"
description.en = "Explain in *a few (10~15) words* the purpose of the app or what it actually does (it is meant to give a rough idea to users browsing a catalog of 100+ apps)"
description.fr = "Expliquez en *quelques* (10~15) mots l'utilité de l'app ou ce qu'elle fait (l'objectif est de donner une idée grossière pour des utilisateurs qui naviguent dans un catalogue de 100+ apps)"

version = "1.2.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-only" # you can see the available licenses identifiers list here: https://spdx.org/licenses/
website = "https://example.com"
demo = "https://demo.example.com"
admindoc = "https://doc.yunohost.org/dev/packaging/"
userdoc = "https://yunohost.org/apps"
code = "https://github.com/markqvist/nomadnet"


[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "amd64"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.standalone]
    ask.en = "Reticulum app is not installed"
    ask.fr = "L'application Reticulumm n'est pas installée"
    type = "boolean"
    default = false

    [install.backbone_remote_enabled]
    ask.en = "Enable backbone client interface"
    ask.fr = "Activer l'interface client backbone"
    type = "boolean"
    optional = true
    visible = "standalone"
    
    [install.backbone_remote_target]
    ask.en = "Remote target (backbone server)"
    ask.fr = "Serveur backbone distant"
    type = "string"
    optional = true
    visible = "standalone"

    [install.backbone_remote_target_port]
    ask.en = "Backbone remote target port"
    ask.fr = "Port backbone du serveur cible"
    type = "number"
    optional = true
    default = "4242"
    min = 0
    max = 65535
    visible = "standalone"

    [install.tcp_client_enabled]
    ask.en = "Enable TCP client interface"
    ask.fr = "Activer l'interface client TCP"
    type = "boolean"
    optional = true
    visible = "standalone"

    [install.tcp_client_target_host]
    ask.en = "Target host"
    ask.fr = "Serveur TCP distant"
    type = "string"
    optional = true
    visible = "standalone"

    [install.tcp_client_target_port]
    ask.en = "TCP remote target port"
    ask.fr = "Port TCP du serveur cible"
    type = "number"
    optional = true
    default = "4243"
    min = 0
    max = 65535
    visible = "standalone"

    
[resources]
    [resources.system_user]

    [resources.install_dir]
    [resources.data_dir]
       
    [resources.apt]
    packages = "build-essential python3-venv"
